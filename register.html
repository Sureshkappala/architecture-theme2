<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Register - Stackly
</title>

<link
rel="stylesheet"
href="css/style.css"
/>

</head>

<body>

<section class="login-page">

<div class="login-left">

</div>

<div class="login-right">

<a
href="login.html"
class="back"
>

← Back to Login

</a>

<h1>

Create Account

</h1>

<input
id="firstName"
type="text"
placeholder="First Name"
/>

<input
id="lastName"
type="text"
placeholder="Last Name"
/>

<input
id="registerEmail"
type="email"
placeholder="Email Address"
/>

<input
id="phone"
type="text"
placeholder="Phone Number"
/>

<input
id="registerPassword"
type="password"
placeholder="Password"
/>

<input
id="confirmPassword"
type="password"
placeholder="Confirm Password"
/>

<label
class="terms"
>

<input type="checkbox">

Agree Terms

</label>

<button
class="signin"
onclick="register()"
>

Create Account

</button>

<div class="signup">

Already have account?

<a href="login.html">

Sign In

</a>

</div>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
