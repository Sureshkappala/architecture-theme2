<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.65)
),

url("https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1600&q=80");

}

.card{

padding:70px;

text-align:center;

background:

}

.logo{

font-size:46px;

.title{

.desc{

margin-top:20px;

}

.actions{

margin-top:40px;

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.btn{

padding:16px 34px;

border-radius:40px;

text-decoration:none;

font-weight:bold;

}

.home{

background:#39b6ff;

color:white;

}

.portfolio{

background:white;

color:#315cff;

}

.btn:hover{

transform:translateY(-4px);

}

@media(max-width:768px){

font-size:120px;

}

.title{

font-size:28px;

}

.card{

padding:40px;

}

}
