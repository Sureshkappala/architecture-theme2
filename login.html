<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Login - Stackly
</title>

<link
rel="stylesheet"
href="css/style.css"
/>

<style>

.login-actions{

display:flex;

flex-direction:column;

gap:15px;

margin-top:20px;

}

.signin{

width:100%;

padding:15px;

background:#315cff;

color:white;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

}

.client{

background:#14b8a6;

}

</style>

<script>

function adminLogin(){

onclick="login()"

}

function clientLogin(){

window.location.href=
"pages/user.html";

}

</script>

</head>

<body>

<section class="login-page">

<div class="login-left">

</div>

<div class="login-right">

<a
href="index.html"
class="back"
>

← Back to Home

</a>

<h1>

Welcome Back

</h1>

<input
id="email"
type="email"
placeholder="Enter your email"
/>

<input
id="password"
type="password"
placeholder="Enter password"
/>

<div class="login-options">

<label>

<input type="checkbox">

Remember me

</label>

<a href="404.html">
Forgot Password?
</a>

</div>

<div class="login-actions">

<button
type="button"
class="signin"
onclick="login()"
>

Sign In admin

</button>

<button
class="signin client"
onclick="clientLogin()"
>

Sign In as Client

</button>

</div>

<div class="signup">

Don't have account?

<a href="register.html">

Sign up

</a>

</div>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
