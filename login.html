<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Stackly Login
</title>

<link
rel="stylesheet"
href="css/style.css"
/>

</head>

<body>

<section class="login">

<div class="login-box">

<h1>
STACKLY
</h1>

<p>
Login to continue
</p>

<input
id="username"
type="text"
placeholder="Username"
/>

<input
id="password"
type="password"
placeholder="Password"
/>

<div class="login-links">

<a href="#">
Forgot Password?
</a>

</div>

<button
onclick="login()"
>

Login

</button>

</div>

</section>

<script src="js/script.js">

</script>

</body>

</html>
